name: Startup profile and speed

# Records the startup profile on an emulator and measures cold start and scrolling. The profile is
# pushed to the baseline-profile branch; copying it to app/src/main/baseline-prof.txt ships it.
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/baseline_profile.yml"
      - ".github/scripts/profile.sh"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Record startup profile
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug signing key
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build the profiling APK
        run: ./gradlew --console=plain :app:assembleFossProfiling --warning-mode summary -x lint

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Record and measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/profile.sh

      - name: Summary
        if: always()
        run: |
          [ -f profile-output/metrics.txt ] || exit 0
          { echo '```'; cat profile-output/metrics.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat profile-output/metrics.txt

      # Artifacts need a login to download; a branch can be fetched with git.
      - name: Publish to the baseline-profile branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/prof
          cp profile-output/baseline-prof.txt profile-output/metrics.txt /tmp/prof/
          cd /tmp/prof
          git init -q -b baseline-profile
          git config user.name "Metrolist Watch CI"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "Startup profile from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" baseline-profile
