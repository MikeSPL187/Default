name: Build Metrolist Watch

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "claude/**"
    paths-ignore:
      - "**/*.md"
      - "fastlane/**"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary

      - name: Build release APK
        run: ./gradlew --console=plain :app:assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      # Signing is optional: add KEYSTORE (base64), KEY_ALIAS, KEYSTORE_PASSWORD and KEY_PASSWORD
      # repository secrets with the key of the installed build to get an APK that updates in place.
      - name: Sign APK
        id: sign
        if: env.HAS_KEYSTORE == 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Report startup profile
        run: |
          apk=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          unzip -l "$apk" | grep -E "baseline\.prof|profileinstaller" || echo "No baseline profile in the APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-watch-foss-release
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

  smoke:
    name: Smoke test on emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: metrolist-watch-foss-release
          path: apk

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke.sh

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            smoke-output/
            *.png
          if-no-files-found: warn

  # Only signed builds of the default branch that passed the smoke test become a release.
  release:
    name: Publish release
    needs: [build, smoke]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: metrolist-watch-foss-release
          path: apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signed=$(ls apk/*-signed.apk 2>/dev/null | head -1)
          if [ -z "$signed" ]; then
            echo "No signed APK (signing secrets missing), skipping the release."
            exit 0
          fi
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          build="$version-b$GITHUB_RUN_NUMBER"
          apk="MetrolistWatch-$build.apk"
          cp "$signed" "$apk"
          changes=$(git log -1 --format=%s "$GITHUB_SHA")
          gh release create "v$build" "$apk" --target "$GITHUB_SHA" --latest \
            --title "Metrolist Watch $build" \
            --notes "Сборка $GITHUB_RUN_NUMBER из коммита $GITHUB_SHA: $changes. Установите $apk на телефон."
          # Keep the five newest builds so there is always something to roll back to.
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

  lint:
    name: Lint report
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Informational: the report lists issues across the whole project without failing the build.
      - name: Lint
        continue-on-error: true
        run: ./gradlew --console=plain :app:lintFossDebug
        env:
          PULL_REQUEST: "false"

      - name: Summarize lint errors and warnings
        if: always()
        run: |
          python3 - <<'EOF'
          import collections, glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/reports/lint-results-*.xml"):
              issues = ET.parse(path).getroot().findall("issue")
              print(collections.Counter((i.get("severity"), i.get("id")) for i in issues).most_common())
              for i in issues:
                  if i.get("severity") in ("Fatal", "Error", "Warning"):
                      loc = i.find("location")
                      where = f'{loc.get("file")}:{loc.get("line")}' if loc is not None else "?"
                      print(f'{i.get("severity")} {i.get("id")} {where.split("/app/src/")[-1]} :: {i.get("message")[:160]}')
          EOF

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn
