# Smoke test: opens the main screens of a fresh install and fails if the app crashes.
appId: com.metrolist.music
---
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Home"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 01-home
- scroll
- takeScreenshot: 02-home-scrolled

- tapOn: "Search"
- waitForAnimationToEnd
- takeScreenshot: 03-search
- back
# If the keyboard was still up, that back only closed it.
- runFlow:
    when:
      notVisible: "Library"
    commands:
      - back

- tapOn: "Library"
- waitForAnimationToEnd
- takeScreenshot: 04-library

- tapOn: "Account"
- waitForAnimationToEnd
- takeScreenshot: 05-account
- tapOn: "Settings"
- waitForAnimationToEnd
- takeScreenshot: 06-settings

- tapOn: "Storage"
- waitForAnimationToEnd
- takeScreenshot: 07-storage
- scrollUntilVisible:
    element: "Smart downloads"
    timeout: 10000
- takeScreenshot: 08-storage-smart-downloads
- scrollUntilVisible:
    element: "Export downloads for watch"
    timeout: 10000
- takeScreenshot: 08b-storage-watch-export
- back

- tapOn: "Content"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Not recommended"
    timeout: 10000
- takeScreenshot: 09-content
- back

- tapOn: "Player and audio"
- waitForAnimationToEnd
- takeScreenshot: 10-player-audio
- back

- tapOn: "Appearance"
- waitForAnimationToEnd
- takeScreenshot: 11-appearance
- back

- scrollUntilVisible:
    element: "AI lyrics translation"
    timeout: 10000
- tapOn: "AI lyrics translation"
- waitForAnimationToEnd
- takeScreenshot: 11b-ai-translation
- back

- scrollUntilVisible:
    element: "Privacy"
    timeout: 10000
- tapOn: "Privacy"
- waitForAnimationToEnd
- takeScreenshot: 11c-privacy
- back

- scrollUntilVisible:
    element: "Backup and restore"
    timeout: 10000
- tapOn: "Backup and restore"
- waitForAnimationToEnd
- takeScreenshot: 11d-backup
- back
- back

- tapOn: "Stats"
- waitForAnimationToEnd
- takeScreenshot: 12-stats
- back

- tapOn: "History"
- waitForAnimationToEnd
- takeScreenshot: 13-history
- back

- tapOn: "Home"
- waitForAnimationToEnd
- takeScreenshot: 14-home-again
