# A tour of every screen for design review. Every step is optional: it never fails the build.
appId: com.metrolist.music
---
- launchApp
- extendedWaitUntil:
    visible: "Skip"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Skip"
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: ${P}00-onboarding
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${P}01-home
- scroll
- takeScreenshot: ${P}02-home-2
- scroll
- takeScreenshot: ${P}03-home-3
- scroll
- takeScreenshot: ${P}04-home-4
# Edit Home lives in the top bar only.
- scrollUntilVisible:
    element: "Edit Home"
    direction: UP
    timeout: 20000
    optional: true
- tapOn:
    text: "Edit Home"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}05-edit-home
- back
- scrollUntilVisible:
    element: "Tune"
    direction: UP
    timeout: 20000
    optional: true
- tapOn:
    text: "Tune"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}06-dj-tune
- back

# Search, results, artist
- tapOn: "Search"
- waitForAnimationToEnd
- takeScreenshot: ${P}07-search
- inputText: "dua lipa"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 10000
# Should the emulator's keyboard keep Enter to itself, the query from history runs the search.
- runFlow:
    when:
      visible: "dua lipa levitating"
    commands:
      - tapOn:
          text: "dua lipa"
          index: 1
          optional: true
      - waitForAnimationToEnd:
          timeout: 10000
- takeScreenshot: ${P}08-search-results
- longPressOn:
    text: "Levitating.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}09-song-menu
- back
- tapOn:
    text: "Levitating.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${P}10-mini-player

# Player and its tabs
- tapOn:
    point: "50%,85%"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${P}11-player
# The music video on the whole screen turns it sideways; closing it must bring the player back upright.
# The switch shows once the song's video has been looked up, which takes a moment.
- extendedWaitUntil:
    visible: "Video"
    timeout: 20000
    optional: true
- tapOn:
    text: "Video"
    optional: true
- extendedWaitUntil:
    visible: "Watch full screen"
    timeout: 30000
    optional: true
- takeScreenshot: ${P}11a-player-video
- runFlow:
    when:
      visible: "Watch full screen"
    commands:
      - tapOn:
          text: "Watch full screen"
          optional: true
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: ${P}11b-video-fullscreen
      # The controls step aside while it plays; a tap away from the buttons brings them back.
      - runFlow:
          when:
            notVisible: "Exit full screen"
          commands:
            - tapOn:
                point: "85%,70%"
                optional: true
      - tapOn:
          text: "Exit full screen"
          optional: true
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: ${P}11c-video-closed
- tapOn:
    text: "Song"
    optional: true
# The player's own menu and the sleep timer, each opened and closed.
- runFlow:
    when:
      visible: "Timer"
    commands:
      - tapOn: "Timer"
      - waitForAnimationToEnd
      - takeScreenshot: ${P}11d-sleep-timer
      - back
      - waitForAnimationToEnd
- tapOn:
    text: "Lyrics"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}12-player-lyrics
- tapOn:
    text: "Lyrics"
    optional: true
- tapOn:
    text: "Queue"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}13-player-queue
# Close the queue, then the player, only as far as they are open: a blind back too many leaves
# the search results.
- runFlow:
    when:
      visible: "Save queue as playlist"
    commands:
      - back
      - waitForAnimationToEnd
# The player's menu last, once lyrics and queue are seen: should it not open, the back that
# follows only closes the player a step early.
- runFlow:
    when:
      visible: "Timer"
    commands:
      - tapOn:
          text: "More options"
          index: 0
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: ${P}11e-player-menu
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Timer"
    commands:
      - back
      - waitForAnimationToEnd

# The artist: the top result of the search, or the artist row among the suggestions when the
# player's closing went one screen further back.
- runFlow:
    when:
      visible: "Top result"
    commands:
      - tapOn:
          text: "Dua Lipa"
          below: "Top result"
          optional: true
- runFlow:
    when:
      visible: "dua lipa levitating"
    commands:
      - tapOn:
          text: "Dua Lipa"
          index: 1
          optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${P}14-artist
- scroll
- takeScreenshot: ${P}15-artist-2

# Album, from the artist's albums
- scrollUntilVisible:
    element:
      text: "Radical Optimism|Future Nostalgia|Dua Lipa \\(Deluxe\\)"
    timeout: 15000
    optional: true
- tapOn:
    text: "Radical Optimism|Future Nostalgia|Dua Lipa \\(Deluxe\\)"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${P}16-album
- back
- back
- runFlow:
    when:
      notVisible: "Library"
    commands:
      - back

# Library, You, settings
- tapOn: "Library"
- waitForAnimationToEnd
- takeScreenshot: ${P}17-library
- tapOn:
    text: "Liked"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}18-liked
- back
- tapOn:
    text: "Playlists"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}18b-playlists
- tapOn:
    text: "Transfer playlists"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}18c-import
- back
# A playlist of one's own: the create dialog once, then the new empty playlist.
- runFlow:
    when:
      notVisible: "Road trip"
    commands:
      - tapOn:
          text: "Create playlist"
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: ${P}18d-create-playlist
      - inputText: "Road trip"
      - tapOn:
          text: "OK"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Road trip"
    commands:
      - tapOn: "Road trip"
      - waitForAnimationToEnd
      - takeScreenshot: ${P}18e-own-playlist
      - back
      - waitForAnimationToEnd
- tapOn:
    text: "Playlists"
    optional: true
- tapOn: "You"
- waitForAnimationToEnd
- takeScreenshot: ${P}19-you
- tapOn:
    text: "THIS WEEK"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}20-stats
- tapOn:
    text: "Month"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}20b-stats-month
- tapOn:
    text: "Year"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}20c-stats-year
- back
# The month's recap card shows only once the month has listening in it.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: ${P}20d-recap
      - back
- waitForAnimationToEnd
- tapOn:
    text: "History"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}21-history
- back
# The other tiles of You, each looked at once and left.
- runFlow:
    when:
      visible: "Together"
    commands:
      - tapOn: "Together"
      - waitForAnimationToEnd
      - takeScreenshot: ${P}21b-together
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Recognized"
    commands:
      - tapOn: "Recognized"
      - waitForAnimationToEnd
      - takeScreenshot: ${P}21c-recognized
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Equalizer"
    commands:
      - tapOn: "Equalizer"
      - waitForAnimationToEnd
      - takeScreenshot: ${P}21d-equalizer
      - back
      - waitForAnimationToEnd
- tapOn:
    text: "Settings"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}22-settings
- scroll
- takeScreenshot: ${P}23-settings-2
- scrollUntilVisible:
    element: "Updater"
    optional: true
- tapOn:
    text: "Updater"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}23b-updater
- back
- scrollUntilVisible:
    element: "Appearance"
    direction: UP
    optional: true
- tapOn:
    text: "Appearance"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}24-appearance
- back
- back

# Charts and new releases from home
- tapOn: "Home"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Chart of the week"
    timeout: 20000
    optional: true
- tapOn:
    text: "Chart of the week"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${P}25-charts
- back
